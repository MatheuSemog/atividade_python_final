{% extends 'base.html' %}
{% block title %}Início - Painel de Tarefas{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">

    <i class="bi bi-check2-square display-1 text-primary"></i>
    <h1 class="display-5 fw-bold mt-3">Painel de Controle de Tarefas</h1>

    <div class="d-flex justify-content-center gap-2">

    </div>
  </div>
