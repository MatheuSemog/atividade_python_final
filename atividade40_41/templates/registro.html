{% extends 'base.html' %}
{% block title %}Registro{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow-sm"><div class="card-body p-4">
      <h2 class="h4 mb-3"><i class="bi bi-person-plus"></i> Criar conta</h2>
      <form method="post">
        <div class="mb-3"><label class="form-label">Nome</label><input class="form-control" name="nome" required maxlength="120"></div>
        <div class="mb-3"><label class="form-label">E-mail</label><input class="form-control" type="email" name="email" required maxlength="180"></div>
        <div class="mb-3"><label class="form-label">Senha</label><input class="form-control" type="password" name="senha" required minlength="6"></div>
        <button class="btn btn-primary w-100" type="submit">Cadastrar</button>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
