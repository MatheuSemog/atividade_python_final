{% extends "base.html" %}
{% block title %}Cadastro · Painel de Tarefas{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h1 class="h4 text-center mb-4"><i class="bi bi-person-plus"></i> Criar conta</h1>
                <form method="POST" action="{{ url_for('registro') }}" novalidate>
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="nome" name="nome" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="senha" name="senha" required minlength="6">
                        <div class="form-text">Mínimo de 6 caracteres.</div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-person-plus"></i> Cadastrar
                    </button>
                </form>
                <p class="text-center mt-3 mb-0">
                    Já tem conta? <a href="{{ url_for('login') }}">Entrar</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
