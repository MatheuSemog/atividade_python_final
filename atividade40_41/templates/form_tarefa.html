{% extends 'base.html' %}
{% block title %}{{ 'Editar' if tarefa else 'Nova' }} tarefa{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm"><div class="card-body p-4">
      <h2 class="h4 mb-4">{{ 'Editar tarefa' if tarefa else 'Nova tarefa' }}</h2>
      <form method="post">
        <div class="mb-3"><label class="form-label">Título</label><input class="form-control" name="titulo" maxlength="160" required value="{{ tarefa['titulo'] if tarefa else '' }}"></div>
        <div class="mb-3"><label class="form-label">Descrição</label><textarea class="form-control" rows="4" name="descricao">{{ tarefa['descricao'] if tarefa else '' }}</textarea></div>
        <div class="mb-3"><label class="form-label">Status</label>
          <select class="form-select" name="status">
            {% for s in ['Pendente', 'Em andamento', 'Concluída'] %}
            <option value="{{ s }}" {% if tarefa and tarefa['status'] == s %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="d-flex gap-2"><button class="btn btn-primary" type="submit"><i class="bi bi-save"></i> Salvar</button><a class="btn btn-outline-secondary" href="{{ url_for('dashboard') }}">Cancelar</a></div>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
